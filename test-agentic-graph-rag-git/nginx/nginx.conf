events {
    worker_connections 1024;
}

# Stream-блок для Bolt (TCP-проксирование)
stream {
    upstream neo4j_bolt {
        server neo4j:7687;
    }

    server {
        listen 7687;
        proxy_pass neo4j_bolt;
        proxy_timeout 10m;
        proxy_connect_timeout 10s;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Основной сервер для UI (порт 80)
    server {
        listen 80;
        server_name _;
	
	client_max_body_size 100M;	
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://ui:8506;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройки для Streamlit (WebSockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # Сервер для Neo4j Browser (порт 7474)
    server {
        listen 7474;
        server_name _;

        auth_basic "Neo4j Access Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://neo4j:7474;
            
            # Важнейшие заголовки, чтобы Neo4j не прыгал на порт 80
            proxy_set_header Host $http_host; 
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Отключаем буферизацию (критично для веб-интерфейса базы)
            proxy_buffering off;
            proxy_redirect off;
        }
    }
}
